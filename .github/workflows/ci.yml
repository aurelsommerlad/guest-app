name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format · Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-secret placeholder values so the production build can validate its env.
      # Real staging/production values live only in Vercel (per environment).
      APP_ENV: staging
      NEXT_PUBLIC_APP_URL: https://staging.stay.unique-places.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
